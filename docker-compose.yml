services:
  postgres:
    image: postgres:17-alpine
    container_name: lin-shi-postgres
    # 避免与本机已安装的 PostgreSQL（常见占用 5432）冲突
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lin_shi
    volumes:
      - lin_shi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lin_shi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lin_shi_pgdata:
