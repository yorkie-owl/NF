services:
  postgres:
    image: postgres:17-alpine
    container_name: lin-shi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-linshi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linshi_dev_pw}
      POSTGRES_DB: ${DB_NAME:-lin_shi}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - lin-shi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-linshi} -d ${DB_NAME:-lin_shi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lin-shi-pgdata:
